<title>Auguste BEGY02300</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Caveat:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Patrick+Hand&display=swap">
<style>
/* Layout : une fiche joueur. Hero en deux colonnes, carrousel des plateformes, puis un paquet de cartes (une bannière et une couleur par compte) avec un panneau de stats dessous qui suit la carte du dessus. */
:root {
  --bg: #E8ECEF;
  --surface: #F5F7F8;
  --fg: #0F1419;
  --muted: #4B5560;
  --line: #C3CBD2;
  --accent: #2B3BFF;
  --accent-ink: #FFFFFF;
  --ok: #0E8A4E;
  --warn: #A8680B;
  --bad: #C23A3A;
  --off: #7B8691;

  /* Couleurs propres à chaque compte, dérivées de la teinte --ah */
  --acc-s: 74%;
  --acc-l: 42%;
  --on-acc: #FFFFFF;
  --ban-s: 75%;
  --ban-l1: 84%;
  --ban-l2: 72%;
  --pat-s: 80%;
  --pat-l: 45%;
  --pat-a: 0.35;

  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

  --fs-small: 0.8125rem;
  --fs-body: 1rem;
  --fs-lead: clamp(1.25rem, 3.4vw, 1.75rem);
  --fs-h2: clamp(2.25rem, 7vw, 3.5rem);
  --fs-hero: clamp(5rem, 24vw, 12rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1015;
    --surface: #151A21;
    --fg: #E8ECF0;
    --muted: #98A3AF;
    --line: #29313B;
    --accent: #00F3FF;
    --accent-ink: #0D1015;
    --ok: #5BD68B;
    --warn: #E5B040;
    --bad: #F26B6B;
    --off: #6B7682;
    --acc-s: 90%;
    --acc-l: 72%;
    --on-acc: #0D1015;
    --ban-s: 55%;
    --ban-l1: 22%;
    --ban-l2: 13%;
    --pat-s: 85%;
    --pat-l: 65%;
    --pat-a: 0.3;
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) body {
    background-image:
      radial-gradient(circle at 15% 15%, rgb(0 243 255 / 0.08), transparent 40%),
      radial-gradient(circle at 85% 85%, rgb(168 85 247 / 0.08), transparent 40%);
  }
  :root:not([data-theme="light"]) .card,
  :root:not([data-theme="light"]) .acct-card,
  :root:not([data-theme="light"]) .panel {
    background-color: rgb(15 23 42 / 0.78);
    backdrop-filter: blur(14px);
  }
}
:root[data-theme="dark"] {
  --bg: #0D1015;
  --surface: #151A21;
  --fg: #E8ECF0;
  --muted: #98A3AF;
  --line: #29313B;
  --accent: #00F3FF;
  --accent-ink: #0D1015;
  --ok: #5BD68B;
  --warn: #E5B040;
  --bad: #F26B6B;
  --off: #6B7682;
  --acc-s: 90%;
  --acc-l: 72%;
  --on-acc: #0D1015;
  --ban-s: 55%;
  --ban-l1: 22%;
  --ban-l2: 13%;
  --pat-s: 85%;
  --pat-l: 65%;
  --pat-a: 0.3;
  color-scheme: dark;
}
:root[data-theme="dark"] body {
  background-image:
    radial-gradient(circle at 15% 15%, rgb(0 243 255 / 0.08), transparent 40%),
    radial-gradient(circle at 85% 85%, rgb(168 85 247 / 0.08), transparent 40%);
}
:root[data-theme="dark"] .card,
:root[data-theme="dark"] .acct-card,
:root[data-theme="dark"] .panel {
  background-color: rgb(15 23 42 / 0.78);
  backdrop-filter: blur(14px);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 2rem;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1120px; margin-inline: auto; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

/* En-tête */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 9;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top .wrap {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 0.25rem 1.5rem; padding-block: 0.75rem;
}
.mark { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; }
.top nav { display: flex; gap: 1.25rem; }
.top nav a { font-family: var(--font-mono); font-size: var(--fs-small); text-transform: uppercase; letter-spacing: 0.08em; text-decoration: none; color: var(--muted); padding-block: 0.25rem; }
.top nav a:hover { color: var(--accent); }
.theme-toggle {
  font-family: var(--font-mono); font-size: var(--fs-small); text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--fg); background: transparent;
  border: 1px solid var(--line); padding: 0.35rem 0.6rem; cursor: pointer;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

/* Hero */
.hero { display: grid; gap: 2.5rem; padding-block: clamp(2rem, 6vw, 4.5rem) clamp(2.5rem, 6vw, 4rem); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .hero { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: end; } }
.hero .eyebrow, .hero h1, .hero .lead, .hero .loop, .hero aside {
  animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
  animation-delay: calc(var(--d, 0) * 110ms);
}
.hero h1 { --d: 1; }
.hero .lead { --d: 2; }
.hero .loop { --d: 3; }
.hero aside { --d: 3; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.75rem; font-family: var(--font-mono); font-size: var(--fs-small); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 1rem; }
.sep { color: var(--line); }
.presence {
  --pc: var(--off);
  display: inline-flex; align-items: baseline; gap: 0.5rem; min-width: 0;
  font-family: var(--font-body); font-size: 0.9375rem; letter-spacing: 0; text-transform: none; color: var(--fg);
}
.presence[data-state="ok"] { --pc: var(--ok); }
.presence[data-state="warn"] { --pc: var(--warn); }
.presence[data-state="bad"] { --pc: var(--bad); }
.presence .dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--pc); flex: none; align-self: center; box-shadow: 0 0 0 3px transparent; }
.presence[data-state="ok"] .dot { animation: ping 2.4s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pc) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
.presence .txt { min-width: 0; overflow-wrap: anywhere; }
.presence .main { font-weight: 700; }
.presence .sub { color: var(--muted); }
h1 {
  font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
  font-size: var(--fs-hero); line-height: 0.82; letter-spacing: -0.01em; margin: 0 0 1.5rem;
  overflow-wrap: anywhere;
}
.lead { font-size: var(--fs-lead); line-height: 1.3; font-weight: 500; margin: 0 0 1.5rem; max-width: 22ch; text-wrap: balance; }
.loop { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; font-family: var(--font-mono); font-size: var(--fs-small); text-transform: uppercase; letter-spacing: 0.06em; }
.loop span.step { border: 1px solid var(--fg); padding: 0.3rem 0.7rem; }
.loop span.step:last-of-type { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.loop .arrow { color: var(--muted); }
.loop .again { display: inline-block; font-size: 1.25rem; color: var(--accent); animation: spin 9s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }

.card { background: var(--surface); border: 1px solid var(--line); padding: 1.25rem; }
.card h2 { font-family: var(--font-mono); font-size: var(--fs-small); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.75rem; }
.card dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.6rem 1.25rem; align-items: baseline; }
.card dt { font-size: var(--fs-small); color: var(--muted); }
.card dd { margin: 0; font-family: var(--font-mono); font-size: 0.9375rem; font-variant-numeric: tabular-nums; text-align: right; overflow-wrap: anywhere; }

/* Sections */
section.block { padding-block: clamp(2.5rem, 6vw, 4.5rem); border-top: 1px solid var(--line); }
.head { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.75rem; }
.head h2 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: var(--fs-h2); line-height: 0.95; margin: 0; text-wrap: balance; }
.head h2 .pt { color: var(--accent); }
.head p { margin: 0.5rem 0 0; color: var(--muted); max-width: 48ch; }
.head .eyebrow { margin: 0 0 0.75rem; }

/* Carrousel des plateformes */
.ctrl { display: flex; gap: 0.5rem; }
.ctrl button, .copy {
  font-family: var(--font-mono); cursor: pointer; background: transparent; color: var(--fg);
  border: 1px solid var(--fg);
}
.ctrl button { width: 2.75rem; height: 2.75rem; font-size: 1.125rem; }
.ctrl button:hover:not(:disabled) { background: var(--fg); color: var(--bg); }
.ctrl button:disabled { opacity: 0.3; cursor: default; }
.track {
  display: flex; gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory;
  padding-bottom: 1rem; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
.plat {
  flex: 0 0 min(19rem, 80%); scroll-snap-align: start;
  display: flex; flex-direction: column; gap: 1rem; min-width: 0;
}
.mono-letter {
  width: 3.5rem; height: 3.5rem; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 2rem; text-transform: uppercase;
  background: var(--accent); color: var(--accent-ink); flex: none;
}
.plat.off .mono-letter { background: transparent; color: var(--muted); border: 1px dashed var(--muted); }
.plat h3 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 1.75rem; line-height: 1; margin: 0; }
.plat .acct { font-family: var(--font-mono); font-size: 0.9375rem; color: var(--muted); margin: 0.35rem 0 0; overflow-wrap: anywhere; }
.badge { align-self: flex-start; font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.15rem 0.5rem; border: 1px solid var(--accent); color: var(--accent); }
.plat.off .badge { border-color: var(--muted); color: var(--muted); }
.plat .foot { margin-top: auto; display: flex; flex-direction: column; gap: 0.75rem; }
.plat .note { margin: 0; font-size: var(--fs-small); color: var(--muted); }
.games { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0; padding: 0; list-style: none; }
.games li { font-size: var(--fs-small); border: 1px solid var(--line); padding: 0.1rem 0.5rem; background: var(--bg); }
.activity-summary { display: grid; gap: 0.5rem; padding-top: 0.25rem; border-top: 1px solid var(--line); }
.activity-heading { margin: 0; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
.activity-list { display: grid; gap: 0.35rem; margin: 0; padding: 0; list-style: none; }
.activity-list li { display: flex; justify-content: space-between; gap: 0.75rem; min-width: 0; font-size: var(--fs-small); }
.activity-game-name { min-width: 0; overflow-wrap: anywhere; }
.activity-game-meta { color: var(--muted); text-align: right; white-space: nowrap; }
.activity-details { border-top: 1px solid var(--line); padding-top: 0.5rem; }
.activity-details summary { color: var(--accent); cursor: pointer; font-size: var(--fs-small); }
.activity-details .games { max-height: 12rem; overflow: auto; margin-top: 0.5rem; }
.activity-message { margin: 0; color: var(--muted); font-size: var(--fs-small); overflow-wrap: anywhere; }
.activity-message.error { color: var(--bad); }
.activity-note { margin: 0; color: var(--muted); font-size: var(--fs-small); }
.activity-note.error { color: var(--bad); }
.activity-avatar { width: 3rem; height: 3rem; border-radius: 50%; object-fit: cover; }
.btn { display: inline-block; text-align: center; padding: 0.6rem 1rem; text-decoration: none; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 0.9375rem; }
.btn:hover { background: var(--accent); color: var(--accent-ink); }

/* Couleurs d'un compte (cartes et panneau) */
.acct-card, .panel {
  --ah: 235;
  --a: hsl(var(--ah) var(--acc-s) var(--acc-l));
  --ban1: hsl(var(--ah) var(--ban-s) var(--ban-l1));
  --ban2: hsl(calc(var(--ah) + 40) var(--ban-s) var(--ban-l2));
  --pat: hsl(var(--ah) var(--pat-s) var(--pat-l) / var(--pat-a));
}

/* Paquet de cartes : toutes les cartes dans la même cellule, la position décide de l'inclinaison */
.stage { display: grid; justify-items: center; padding: 1.5rem 1.25rem 2.5rem; overflow: hidden; touch-action: pan-y; }
.acct-card {
  grid-area: 1 / 1; width: min(34rem, 100%); min-width: 0; position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 1.25rem;
  padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
  box-shadow: 0 22px 44px -24px rgb(0 0 0 / 0.5);
  transform-origin: 50% 100%;
  transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.45s ease;
}
.acct-card > * { transition: opacity 0.3s ease; }
.acct-card[data-pos="0"] { transform: rotate(1deg); z-index: 3; animation: bob 7s ease-in-out infinite; }
.acct-card[data-pos="1"] { transform: translate(-1.25rem, 0.9rem) rotate(-2.5deg) scale(0.97); z-index: 2; opacity: 0.92; }
.acct-card[data-pos="2"] { transform: translate(1.1rem, 1.6rem) rotate(4deg) scale(0.94); z-index: 1; opacity: 0.75; }
.acct-card[data-pos="hide"] { transform: translate(0, 1.5rem) scale(0.9); opacity: 0; z-index: 0; pointer-events: none; }
.acct-card[data-pos="hide"][data-exit="left"] { transform: translate(-112%, 0.5rem) rotate(-14deg); z-index: 4; }
.acct-card:not([data-pos="0"]) > * { opacity: 0; }
.acct-card[data-enter="next"] { animation: enter-next 0.55s cubic-bezier(0.2, 0.8, 0.2, 1); }
.acct-card[data-enter="prev"] { animation: enter-prev 0.55s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes enter-next { from { opacity: 0; transform: translate(3rem, 0.5rem) rotate(9deg) scale(0.91); } }
@keyframes enter-prev { from { opacity: 0; transform: translate(-3rem, 0.5rem) rotate(-9deg) scale(0.91); } }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }

/* Entrée en éventail, une seule fois quand le paquet arrive à l'écran */
@keyframes deal { from { opacity: 0; transform: translate(0, 3rem) rotate(-9deg) scale(0.88); } }
.stage.play .acct-card[data-pos="0"], .stage.play .acct-card[data-pos="1"], .stage.play .acct-card[data-pos="2"] {
  animation: deal 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}
.stage.play .acct-card[data-pos="2"] { animation-delay: 0ms; }
.stage.play .acct-card[data-pos="1"] { animation-delay: 140ms; }
.stage.play .acct-card[data-pos="0"] { animation-delay: 280ms; }

/* Lueur qui suit le pointeur */
.acct-card::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.35s ease;
  background: radial-gradient(18rem circle at var(--mx, 50%) var(--my, 30%), color-mix(in srgb, var(--a) 16%, transparent), transparent 70%);
}
.acct-card[data-pos="0"]:hover::before { opacity: 1; }

/* Bannière propre à chaque compte (motif + dégradé, ou ton image) */
.banner {
  position: relative; overflow: hidden; height: 5.5rem; margin: -1.5rem -1.5rem 0;
  background: linear-gradient(115deg, var(--ban1), var(--ban2));
}
.banner::before { content: ""; position: absolute; inset: 0; }
.banner.p0::before { background: repeating-linear-gradient(135deg, var(--pat) 0 2px, transparent 2px 14px); }
.banner.p1::before { background: radial-gradient(circle at 1px 1px, var(--pat) 1.6px, transparent 1.9px) 0 0 / 16px 16px; }
.banner.p2::before { background: linear-gradient(var(--pat) 1px, transparent 1px) 0 0 / 22px 22px, linear-gradient(90deg, var(--pat) 1px, transparent 1px) 0 0 / 22px 22px; }
.banner.p3::before { background: repeating-radial-gradient(circle at 85% 130%, transparent 0 14px, var(--pat) 14px 16px); }
.banner.p4::before { background: repeating-linear-gradient(45deg, var(--pat) 0 1px, transparent 1px 12px), repeating-linear-gradient(-45deg, var(--pat) 0 1px, transparent 1px 12px); }
.banner.p5::before { background: linear-gradient(135deg, var(--pat) 25%, transparent 25%) -10px 0 / 20px 20px, linear-gradient(225deg, var(--pat) 25%, transparent 25%) -10px 0 / 20px 20px; }
.banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.banner::after {
  content: ""; position: absolute; inset: 0; transform: translateX(-120%);
  background: linear-gradient(100deg, transparent 35%, rgb(255 255 255 / 0.28) 50%, transparent 65%);
}
.acct-card[data-pos="0"] .banner::after { animation: shine 6s ease-in-out 1.2s infinite; }
@keyframes shine { 0% { transform: translateX(-120%); } 35%, 100% { transform: translateX(120%); } }
.count {
  position: absolute; top: 0.75rem; right: 0.75rem; z-index: 1; margin: 0;
  font-family: var(--font-mono); font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase;
  background: var(--surface); color: var(--fg); padding: 0.2rem 0.6rem; border-radius: 1rem; font-variant-numeric: tabular-nums;
}
.acct-top { display: flex; align-items: flex-end; gap: 1rem; min-width: 0; margin-top: -2.6rem; position: relative; z-index: 1; }
.acct-top .mono-letter { border-radius: 0.9rem; background: var(--a); color: var(--on-acc); border: 4px solid var(--surface); width: 3.75rem; height: 3.75rem; }
.acct-top h3 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 2rem; line-height: 0.95; margin: 0 0 0.15rem; overflow-wrap: anywhere; }
.acct-user { font-family: var(--font-mono); font-size: 1rem; margin: 0; overflow-wrap: anywhere; }
.acct-desc { margin: 0; color: var(--muted); }
.kv { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.kv .item { display: grid; gap: 0.15rem; border: 1px solid var(--line); background: var(--bg); border-radius: 0.75rem; padding: 0.55rem 0.75rem; max-width: 100%; min-width: 0; }
.kv .lab { font-size: 0.75rem; color: var(--muted); }
.kv .val { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem; min-width: 0; }
.kv code { font-family: var(--font-mono); font-size: 0.8125rem; font-weight: 500; overflow-wrap: anywhere; user-select: all; }
.copy { font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.2rem 0.5rem; border-color: var(--line); color: var(--muted); border-radius: 0.5rem; }
.copy:hover { border-color: var(--accent); color: var(--accent); }
.acct-card .btn { align-self: flex-start; border-radius: 0.75rem; padding: 0.7rem 1.1rem; }
.acct-card .btn:hover { background: var(--a); color: var(--on-acc); }

.deck-nav { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.75rem 1rem; }
.deck-nav .arrow-btn { width: 2.75rem; height: 2.75rem; border-radius: 50%; font-family: var(--font-mono); font-size: 1.125rem; cursor: pointer; background: transparent; color: var(--fg); border: 1px solid var(--line); transition: transform 0.2s ease, border-color 0.2s ease, color 0.2s ease; }
.deck-nav .arrow-btn:hover { border-color: var(--accent); color: var(--accent); }
.deck-nav .arrow-btn:active { transform: scale(0.92); }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; max-width: 22rem; }
.dot-btn { position: relative; width: 0.6rem; height: 0.6rem; border-radius: 0.3rem; border: 0; padding: 0; background: var(--line); cursor: pointer; transition: width 0.3s ease, background 0.3s ease; }
.dot-btn::after { content: ""; position: absolute; inset: -0.5rem -0.2rem; }
.dot-btn[aria-current="true"] { width: 1.5rem; background: var(--accent); }
.dots.auto .dot-btn[aria-current="true"] { background: var(--line); overflow: hidden; }
.dots.auto .dot-btn[aria-current="true"]::before { content: ""; position: absolute; inset: 0; background: var(--accent); transform-origin: left; animation: fill var(--auto-ms, 6500ms) linear backwards; }
@keyframes fill { from { transform: scaleX(0); } }

  /* ---------- Navigation du paquet ---------- */
  function go(i, dir) {
    var old = active;
    var d = dir !== undefined ? dir : (i > old ? 1 : -1);
    active = ((i % total) + total) % total;
    if (active === old) return;
    if (d > 0) {
      var out = cards[old];
      out.setAttribute("data-exit", "left");
      setTimeout(function () { out.removeAttribute("data-exit"); }, 600);
    }
    var incoming = cards[active];
    incoming.setAttribute("data-enter", d > 0 ? "next" : "prev");
    setTimeout(function () { incoming.removeAttribute("data-enter"); }, 600);
    paint();
    restartProgress();
  }
  function paint() {
    cards.forEach(function (c, idx) {
      var off = (idx - active + total) % total;
      c.setAttribute("data-pos", off < 3 ? String(off) : "hide");
      if (off === 0) { c.removeAttribute("inert"); c.removeAttribute("aria-hidden"); }
      else { c.setAttribute("inert", ""); c.setAttribute("aria-hidden", "true"); }
    });
    dots.forEach(function (dt, idx) {
      if (idx === active) dt.setAttribute("aria-current", "true");
      else dt.removeAttribute("aria-current");
    });
    buildPanel(true);
  }

  /* Lecture automatique : démarre quand le paquet est visible, s'arrête au premier geste */
  var autoTimer = null, autoStopped = !CONFIG.autoplayMs, stageVisible = false;
  dotsEl.style.setProperty("--auto-ms", CONFIG.autoplayMs + "ms");
  function stopTimer() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  function restartProgress() {
    dotsEl.classList.remove("auto");
    if (autoTimer) { void dotsEl.offsetWidth; dotsEl.classList.add("auto"); }
  }
  function startAuto() {
    stopTimer();
    if (autoStopped || reduceMotion() || !stageVisible) { dotsEl.classList.remove("auto"); return; }
    autoTimer = setInterval(function () { go(active + 1, 1); }, CONFIG.autoplayMs);
    restartProgress();
  }
  function userAction() {
    autoStopped = true;
    stopTimer();
    dotsEl.classList.remove("auto");
  }

  $("d-prev").addEventListener("click", function () { userAction(); go(active - 1, -1); });
  $("d-next").addEventListener("click", function () { userAction(); go(active + 1, 1); });
  stage.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { e.preventDefault(); userAction(); go(active - 1, -1); }
    if (e.key === "ArrowRight") { e.preventDefault(); userAction(); go(active + 1, 1); }
  });
  var startX = null;
  stage.addEventListener("pointerdown", function (e) { startX = e.clientX; });
  stage.addEventListener("pointerup", function (e) {
    if (startX === null) return;
    var dx = e.clientX - startX;
    startX = null;
    if (Math.abs(dx) > 45) { userAction(); go(active + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1); }
  });
  stage.addEventListener("pointercancel", function () { startX = null; });
  stage.addEventListener("pointermove", function (e) {
    var c = cards[active];
    if (!c || e.pointerType === "touch") return;
    var r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px");
    c.style.setProperty("--my", (e.clientY - r.top) + "px");
  });
  stage.addEventListener("pointerenter", function () { if (autoTimer) { stopTimer(); dotsEl.classList.remove("auto"); } });
  stage.addEventListener("pointerleave", function () { if (!autoStopped) startAuto(); });
  stage.addEventListener("focusin", function () { userAction(); });

  var played = false;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        stageVisible = en.isIntersecting;
        if (en.isIntersecting && !played && !reduceMotion()) {
          played = true;
          stage.classList.add("play");
          setTimeout(function () { stage.classList.remove("play"); }, 1600);
        }
        if (en.isIntersecting) startAuto(); else { stopTimer(); dotsEl.classList.remove("auto"); }
      });
    }, { threshold: 0.35 }).observe(stage);
  }

  panelReady = true;
  paint();

  /* Le statut démarre en dernier, une fois le paquet prêt */
  poll();
  connect();
  setInterval(function () { if (!socketOpen && pollFails < 3) poll(); }, 30000);
})();
</script>
