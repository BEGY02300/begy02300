<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="BEGY02300 · Je crée, je teste, je recommence." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.55" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC">
      <stop offset="0" stop-color="#f778ba" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f778ba" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="300" rx="18"/>
    </clipPath>
    <clipPath id="nameClip">
      <text x="80" y="186" font-family="'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2">BEGY02300</text>
    </clipPath>
  </defs>

  <style>
    .lbl { font: 600 13px 'Segoe UI', 'SF Pro Text', Helvetica, Arial, sans-serif; letter-spacing: 3px; fill: #8b949e; }
    .tag { font: 400 27px 'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .w { fill-opacity: 0; animation: rise 0.9s ease-out forwards; }
    .w1 { animation-delay: 0.6s; }
    .w2 { animation-delay: 1.5s; }
    .w3 { animation-delay: 2.4s; }
    .blink { fill-opacity: 0; animation: blink 1.1s steps(1) infinite; animation-delay: 3.3s; }
    @keyframes rise { from { fill-opacity: 0; } to { fill-opacity: 1; } }
    @keyframes blink { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: 0; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <circle cx="260" cy="30" r="260" fill="url(#glowA)">
      <animate attributeName="cx" values="260;340;260" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="310" r="260" fill="url(#glowB)">
      <animate attributeName="cy" values="310;250;310" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="320" r="200" fill="url(#glowC)">
      <animate attributeName="cx" values="640;560;640" dur="16s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(1010 150)">
      <circle r="150" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-dasharray="2 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="60s" repeatCount="indefinite"/>
        <circle r="108" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-dasharray="4 6"/>
        <circle cx="108" cy="0" r="5" fill="#a371f7"/>
        <circle cx="-76" cy="-76" r="3" fill="#f778ba"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
        <circle r="64" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
        <circle cx="64" cy="0" r="4.5" fill="#58a6ff"/>
      </g>
      <circle r="9" fill="url(#accent)">
        <animate attributeName="r" values="9;12;9" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="80" y="84" class="lbl">AUGUSTE  ·  DÉVELOPPEUR EN APPRENTISSAGE  ·  FRANCE</text>
    <rect x="80" y="102" width="64" height="4" rx="2" fill="url(#accent)"/>

    <text x="80" y="186" font-family="'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#accent)">BEGY02300</text>

    <g clip-path="url(#nameClip)">
      <rect x="-260" y="90" width="200" height="120" fill="url(#shine)" transform="skewX(-20)">
        <animate attributeName="x" values="-260;760;760" keyTimes="0;0.3;1" dur="8s" begin="3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="80" y="244" class="tag"><tspan class="w w1">Je crée,</tspan> <tspan class="w w2">je teste,</tspan> <tspan class="w w3">je recommence.</tspan><tspan class="blink" fill="#58a6ff">_</tspan></text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#30363d"/>
  <path d="M18.5,0.5H1181.5A18,18 0 0 1 1199.5,18.5V281.5A18,18 0 0 1 1181.5,299.5H18.5A18,18 0 0 1 0.5,281.5V18.5A18,18 0 0 1 18.5,0.5Z" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="7 93">
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="10s" repeatCount="indefinite"/>
  </path>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
