<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="BEGY02300 · Je crée, je teste, je recommence." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151a2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.55" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="280" rx="16"/>
    </clipPath>
    <clipPath id="type">
      <rect x="80" y="200" height="44" width="0">
        <animate attributeName="width" from="0" to="560" dur="3s" begin="0.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>

    <circle cx="980" cy="40" r="230" fill="url(#glowA)">
      <animate attributeName="cx" values="980;1050;980" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="270" r="210" fill="url(#glowB)">
      <animate attributeName="cy" values="270;220;270" dur="12s" repeatCount="indefinite"/>
    </circle>

    <text x="1010" y="196" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="150" font-weight="700" fill="url(#accent)" opacity="0.16" text-anchor="middle">&lt;/&gt;</text>

    <text x="80" y="82" font-family="'Segoe UI', 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#8b949e" opacity="0">
      DÉVELOPPEUR EN APPRENTISSAGE  ·  MAKER
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.1s" fill="freeze"/>
    </text>

    <rect x="80" y="98" width="64" height="4" rx="2" fill="url(#accent)"/>

    <text x="80" y="178" font-family="'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-1" fill="url(#accent)">BEGY02300</text>

    <g clip-path="url(#type)">
      <text x="80" y="228" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="26" fill="#c9d1d9"><tspan fill="#a371f7">&gt;</tspan> Je crée, je teste, je recommence.</text>
    </g>
    <rect x="612" y="206" width="12" height="28" fill="#58a6ff" opacity="0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="279" rx="16" fill="none" stroke="#30363d"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
