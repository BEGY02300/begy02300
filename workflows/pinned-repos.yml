
name: Update pinned repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Update pinned repositories
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const query = `
              query {
                user(login: "BEGY02300") {
                  pinnedItems(first: 6, types: REPOSITORY) {
                    nodes {
                      ... on Repository {
                        name
                        description
                        url
                        stargazerCount
                        primaryLanguage {
                          name
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query);
            const repos = result.user.pinnedItems.nodes;

            const rows = repos.map(repo => {
              const description = (repo.description || "No description")
                .replace(/\|/g, "\\|")
                .replace(/\r?\n/g, " ");

              return `| [${repo.name}](${repo.url}) | ${description} | ${repo.primaryLanguage?.name || "—"} | ⭐ ${repo.stargazerCount} |`;
            });

            const section = [
              "| Repository | Description | Language | Stars |",
              "|---|---|---|---|",
              ...rows
            ].join("\n");

            const start = "<!-- PINNED-REPOS-START -->";
            const end = "<!-- PINNED-REPOS-END -->";

            const path = "README.md";
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path
            });

            const content = Buffer.from(file.content, "base64").toString("utf8");

            if (!content.includes(start) || !content.includes(end)) {
              throw new Error("README markers not found");
            }

            const updated = content.replace(
              new RegExp(`${start}[\\s\\S]*?${end}`),
              `${start}\n${section}\n${end}`
            );

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "chore: update pinned repositories",
              content: Buffer.from(updated).toString("base64"),
              sha: file.sha
            });
